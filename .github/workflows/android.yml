name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: chatverse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CHATVERSE_POSTHOG_API_KEY: ${{ secrets.CHATVERSE_POSTHOG_API_KEY }}
      CHATVERSE_POSTHOG_HOST: ${{ vars.CHATVERSE_POSTHOG_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Run unit tests and Android lint
        run: gradle :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Prepare final debug APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ChatVerse-Final-Debug.apk

      - name: Upload final debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatVerse-Final-Debug.apk
          path: app/build/outputs/apk/debug/ChatVerse-Final-Debug.apk
          if-no-files-found: error
          retention-days: 14

      # Emulator startup is resource-heavy on shared hosted runners. Keep it
      # diagnostic: a runner/system ANR must not invalidate a successful APK build.
      - name: Android emulator install and launch smoke test
        id: emulator_smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          ram-size: 4096M
          heap-size: 1024M
          cores: 2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash .github/scripts/emulator-smoke.sh

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChatVerse-Emulator-Diagnostics
          path: |
            emulator-logcat.txt
            chatverse-preview.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Report emulator smoke result
        if: always()
        run: |
          echo "Emulator smoke-test outcome: ${{ steps.emulator_smoke.outcome }}"
          echo "A failed emulator job is reported separately from unit tests, lint, and APK build."
