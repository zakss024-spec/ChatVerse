name: Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: chatverse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Run unit tests and Android lint
        run: gradle :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatVerse-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Android emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.chatverse.app || true
            adb shell am start -W -n com.chatverse.app/.MainActivity
            app_pid=""
            for attempt in $(seq 1 20); do
              app_pid="$(adb shell pidof com.chatverse.app | tr -d '\r')"
              if [ -n "$app_pid" ]; then break; fi
              sleep 3
            done
            if [ -z "$app_pid" ]; then
              echo "ChatVerse process did not remain alive after launch."
              adb shell dumpsys activity activities
              adb logcat -d -s AndroidRuntime:E ActivityTaskManager:E
              exit 1
            fi
            sleep 5
            adb shell screencap -p /sdcard/chatverse-preview.png
            adb pull /sdcard/chatverse-preview.png chatverse-preview.png

      - name: Upload emulator preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChatVerse-emulator-preview
          path: chatverse-preview.png
